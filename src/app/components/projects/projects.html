<section id="projects" class="projects-section">

  <div class="container">

    <h2 class="section-title">
      Featured Projects
    </h2>

    <div
      class="row justify-content-center mb-5"
      *ngFor="let project of projects; let i = index">

      <div class="col-lg-10">

        <div class="glass-card project-card">

          <div class="row align-items-center">

            <!-- Left Side Carousel -->
            <div class="col-md-5">

              <div
                [id]="'projectCarousel' + i"
                class="carousel slide">

                <div class="carousel-inner">

                  <div
                    *ngFor="let image of project.images; let first = first"
                    class="carousel-item"
                    [class.active]="first">

                    <img
                      [src]="image"
                      class="d-block w-100 project-image"
                      [alt]="project.title">

                  </div>

                </div>

                <button
                  class="carousel-control-prev"
                  type="button"
                  [attr.data-bs-target]="'#projectCarousel' + i"
                  data-bs-slide="prev">

                  <span class="carousel-control-prev-icon"></span>

                </button>

                <button
                  class="carousel-control-next"
                  type="button"
                  [attr.data-bs-target]="'#projectCarousel' + i"
                  data-bs-slide="next">

                  <span class="carousel-control-next-icon"></span>

                </button>

              </div>

            </div>

            <!-- Right Side Content -->
            <div class="col-md-7">

              <h3 class="project-title">
                {{ project.title }}
              </h3>

              <p class="project-description">
                {{ project.description }}
              </p>

              <div class="project-badges">

                <span
                  class="badge"
                  *ngFor="let tech of project.technologies">

                  {{ tech }}

                </span>

              </div>

              <div class="metrics-container">

                <div
                  class="metric-box"
                  *ngFor="let metric of project.metrics">

                  <h4>{{ metric.value }}</h4>

                  <span>{{ metric.label }}</span>

                </div>

              </div>

              <ul class="project-features">

                <li
                  *ngFor="let feature of project.features">

                  ✅ {{ feature }}

                </li>

              </ul>

              <div class="mt-4">

                <a
                  [href]="project.liveDemoUrl"
                  target="_blank"
                  class="btn btn-info me-2">

                  Live Demo

                </a>

                <a
                  [href]="project.githubUrl"
                  target="_blank"
                  class="btn btn-outline-info">

                  GitHub

                </a>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
